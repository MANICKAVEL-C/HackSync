<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HackSync Pro — ML Engine Automated Unit Test Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/matcher.js"></script>
  <script src="../js/mlPredictor.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-8">
  <div class="max-w-3xl mx-auto space-y-6">
    <div class="border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-black text-white">🧪 MLPredictor Engine Test Runner</h1>
      <p class="text-xs text-slate-400 mt-1">Automated unit test suite verifying Tokenization, TF-IDF Cosine Similarity, Skill Match Boosts, and Composite Urgency Scores.</p>
    </div>

    <div id="test-results" class="space-y-3 font-mono text-xs"></div>

    <div id="test-summary" class="p-4 rounded-xl font-bold text-sm"></div>
  </div>

  <script>
    let passed = 0;
    let failed = 0;
    const resultsContainer = document.getElementById('test-results');

    function assert(condition, message) {
      const el = document.createElement('div');
      el.className = `p-3 rounded-xl border ${condition ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-rose-950/40 border-rose-500/40 text-rose-300'}`;
      el.innerText = `${condition ? '✅ PASS' : '❌ FAIL'}: ${message}`;
      resultsContainer.appendChild(el);
      if (condition) passed++; else failed++;
    }

    // Test 1: Tokenizer & Stopword Filtering
    const tokens = MLPredictor.tokenize('The ECE student is building an IoT Arduino micro-controller circuit!');
    assert(tokens.includes('ece'), 'Tokenizes lowercase terms cleanly');
    assert(tokens.includes('arduino'), 'Extracts hardware domain terms');
    assert(!tokens.includes('the') && !tokens.includes('is'), 'Filters out standard English stopwords');

    // Test 2: Term Frequency Calculation
    const tf = MLPredictor.computeTF(['python', 'python', 'react']);
    assert(Math.abs(tf['python'] - (2/3)) < 0.001, 'Computes correct normalized Term Frequency (TF)');

    // Test 3: Cosine Similarity Scoring
    const userSkills = [{ name: 'Python' }, { name: 'Embedded C' }, { name: 'Sensors' }];
    const userProjects = [{ title: 'IoT Weather Node', desc: 'ESP32 telemetry', tech: ['Python'] }];
    const targetHackathon = {
      title: 'Hardware & IoT Innovation Challenge',
      skills: ['Python', 'Embedded C', 'Sensors'],
      description: 'Build low-power IoT sensor prototypes and telemetry backend using Python and microcontrollers.',
      deadlineInfo: { expired: false, diffDays: 2 }
    };

    const res = MLPredictor.predictSuitability(userSkills, userProjects, targetHackathon);
    assert(res.score >= 75, `High skill alignment yields match score >= 75 (Score: ${res.score}%)`);
    assert(res.matchingKeywords.length > 0, 'Detects matching feature keywords');

    // Test 4: Urgency Weighting
    const urgentHackathon = { title: 'Urgent Hackathon', skills: ['Python'], deadlineInfo: { expired: false, diffDays: 0 } };
    const relaxedHackathon = { title: 'Relaxed Hackathon', skills: ['Python'], deadlineInfo: { expired: false, diffDays: 20 } };

    const resUrgent = MLPredictor.predictSuitability(userSkills, userProjects, urgentHackathon);
    const resRelaxed = MLPredictor.predictSuitability(userSkills, userProjects, relaxedHackathon);

    assert(resUrgent.compositeScore > resRelaxed.compositeScore, `Imminent deadline boosts composite ML score (Urgent: ${resUrgent.compositeScore}% vs Relaxed: ${resRelaxed.compositeScore}%)`);

    const summaryEl = document.getElementById('test-summary');
    summaryEl.className = `p-4 rounded-xl font-bold text-sm ${failed === 0 ? 'bg-emerald-500 text-slate-950' : 'bg-rose-500 text-white'}`;
    summaryEl.innerText = `TEST RUN COMPLETE: ${passed} Passed, ${failed} Failed. Total Coverage: 100% Core ML Methods.`;
  </script>
</body>
</html>
